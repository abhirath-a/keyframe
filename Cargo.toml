[package]
name = "keyframe"
version = "0.1.0"
edition = "2021"
description = "minimal rust-based pdf presenter"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
egui = "0.28"

mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
directories = "5"

[profile.release]
opt-level = 3
lto = true
