[package]
name = "keyframe"
version = "0.1.0"
edition = "2021"
description = "minimal rust-based pdf presenter"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
  "glow",
  "default_fonts",
  "x11",
  "wayland"
] }
egui = "0.28"

mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
directories = "5"
rfd = "0.15"
tempfile = "3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
strip = "debuginfo"
