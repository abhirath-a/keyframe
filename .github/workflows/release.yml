name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: keyframe.exe
            artifact: keyframe-windows-x64.exe

          # Linux
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: keyframe
            artifact: keyframe-linux-x64

          # macOS Apple Silicon
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: keyframe
            artifact: keyframe-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # MuPDF uses bindgen, which needs libclang.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libclang-dev \
            llvm-dev \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          cp \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
