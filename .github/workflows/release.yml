name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            binary: keyframe.exe
            artifact: keyframe-windows-x64.exe
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            binary: keyframe
            artifact: keyframe-linux-x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            binary: keyframe
            artifact: keyframe-linux-arm64
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
            binary: keyframe
            artifact: keyframe-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            binary: keyframe
            artifact: keyframe-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev desktop-file-utils \
            file patchelf squashfs-tools xvfb xauth

      - name: Find macOS libclang
        if: runner.os == 'macOS'
        run: |
          clang_lib="$(dirname "$(xcrun --find clang)")/../lib"
          if [ ! -f "$clang_lib/libclang.dylib" ]; then
            if ! brew list llvm >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm
            fi
            clang_lib="$(brew --prefix llvm)/lib"
          fi
          echo "LIBCLANG_PATH=$clang_lib" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies and native build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}-release
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Test
        # Reuse release-profile dependencies, including the expensive MuPDF build.
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Resolve-Path "target/${{ matrix.target }}/release/keyframe.exe").Path
          ./scripts/package-windows.ps1 -BinaryPath $binary -SkipBuild
          if (!(Test-Path dist/keyframe-windows-x64-setup.exe)) { throw 'Installer was not produced.' }

      - name: Package and validate macOS installer
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh "target/${{ matrix.target }}/release/keyframe" "${{ matrix.arch }}"

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh "target/${{ matrix.target }}/release/keyframe" "${{ matrix.arch }}"

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WINIT_UNIX_BACKEND: x11
        run: |
          xvfb-run -a python3 scripts/smoke-desktop.py "dist/keyframe-linux-${{ matrix.arch }}.AppImage"

      - name: Prepare artifacts and checksums
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          python3 scripts/checksums.py dist "${{ matrix.artifact }}-SHA256SUMS.txt"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-packages
          if-no-files-found: error
          # Installers and archives are already compressed.
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}
          path: |
            dist/${{ matrix.artifact }}
            dist/*-setup.exe
            dist/*.pkg
            dist/*-app.zip
            dist/*.AppImage
            dist/*-desktop.tar.gz
            dist/*-SHA256SUMS.txt

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
